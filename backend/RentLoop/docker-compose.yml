services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rentloop-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_MEMORY_LIMIT_MB=1024
    ports:
      - "14330:1433"
    volumes:
      - rentloop_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rentloop-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: RentLoop.API/Dockerfile
    container_name: rentloop-api
    ports:
      - "5068:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - RabbitMQ__Host=${RabbitMQ__Host}
      - RabbitMQ__User=${RabbitMQ__User}
      - RabbitMQ__Pass=${RabbitMQ__Pass}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__ExpiresMinutes=${Jwt__ExpiresMinutes}
      - PayPal__Mode=${PayPal__Mode}
      - PayPal__ClientId=${PayPal__ClientId}
      - PayPal__Secret=${PayPal__Secret}
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: RentLoop.Worker/Dockerfile
    container_name: rentloop-worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=${RabbitMQ__Host}
      - RabbitMQ__User=${RabbitMQ__User}
      - RabbitMQ__Pass=${RabbitMQ__Pass}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
    restart: on-failure

volumes:
  rentloop_sql_data: